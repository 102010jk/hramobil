name: Build Android APK (Vaječná kráva)

on:
  push:
    paths:
      - 'vajecna-krava/**'
      - '.github/workflows/android-krava.yml'
  workflow_dispatch:

concurrency:
  group: android-krava-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Stejný Capacitor projekt, ale jiná aplikace: přepíšeme konfiguraci a zdroje ikon jen v CI.
      - name: Configure Capacitor for Vaječná kráva
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "cz.vajecnakrava.app",
            "appName": "Vaječná kráva",
            "webDir": "vajecna-krava",
            "backgroundColor": "#6ec6ff",
            "android": { "backgroundColor": "#6ec6ff" }
          }
          JSON
          rm -rf assets
          cp -r vajecna-krava/assets assets

      - name: Add Android platform
        run: npx cap add android

      - name: Generate icons and splash screens
        continue-on-error: true
        run: >
          npx capacitor-assets generate --android
          --iconBackgroundColor '#6ec6ff' --iconBackgroundColorDark '#6ec6ff'
          --splashBackgroundColor '#6ec6ff' --splashBackgroundColorDark '#6ec6ff'

      - name: Lock portrait orientation and set versionCode
        continue-on-error: true
        run: |
          sed -i 's|android:launchMode="singleTask"|android:launchMode="singleTask"\n            android:screenOrientation="portrait"|' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1\$/versionCode ${{ github.run_number }}/" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VajecnaKrava.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VajecnaKrava-apk
          path: VajecnaKrava.apk
          if-no-files-found: error

      - name: Remove previous apk-vajecna-krava release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete apk-vajecna-krava --yes --cleanup-tag --repo "${{ github.repository }}" || true

      - name: Publish release apk-vajecna-krava
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-vajecna-krava
          target_commitish: ${{ github.sha }}
          name: Vaječná kráva – nejnovější APK
          body: |
            Hra Vaječná kráva – debug APK z commitu ${{ github.sha }} (větev `${{ github.ref_name }}`).
            Stáhni `VajecnaKrava.apk`, otevři ho v telefonu a povol instalaci z neznámých zdrojů.
          prerelease: true
          make_latest: false
          files: VajecnaKrava.apk
