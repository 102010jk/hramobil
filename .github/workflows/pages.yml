name: Deploy web (PWA)

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pokud Pages ještě nejsou zapnuté (Settings -> Pages -> Source: GitHub Actions), job nezhavaruje celý workflow.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      # Vaječná kráva běží na webu jako /vajecna-krava/
      - name: Add Vaječná kráva
        run: |
          if [ -d vajecna-krava ]; then
            cp -r vajecna-krava www/vajecna-krava
            rm -rf www/vajecna-krava/assets
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: www

      - id: deployment
        uses: actions/deploy-pages@v4
