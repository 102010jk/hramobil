name: Build PC (Vaječná kráva)

on:
  push:
    paths:
      - 'vajecna-krava/**'
      - '.github/workflows/pc-krava.yml'
  workflow_dispatch:

concurrency:
  group: pc-krava-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Build HTML + EXE
        run: node vajecna-krava/tools/build-pc.mjs
      - name: Zip
        working-directory: vajecna-krava/dist
        run: |
          zip -9 VajecnaKrava-Windows.zip VajecnaKrava.exe
          zip -9 VajecnaKrava-HTML.zip vajecna-krava.html
      - uses: actions/upload-artifact@v4
        with:
          name: VajecnaKrava-PC
          path: |
            vajecna-krava/dist/VajecnaKrava-Windows.zip
            vajecna-krava/dist/VajecnaKrava-HTML.zip
      - name: Remove previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete vajecna-krava-pc --yes --cleanup-tag --repo "${{ github.repository }}" || true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: vajecna-krava-pc
          target_commitish: ${{ github.sha }}
          name: Vaječná kráva – PC (Windows exe + HTML)
          body: |
            **VajecnaKrava-Windows.zip** – rozbal a spusť `VajecnaKrava.exe` (Windows 10/11).
            **VajecnaKrava-HTML.zip** – jeden HTML soubor, otevři dvojklikem v Chrome/Edge/Firefoxu (Windows, Mac, Linux). Funguje i bez internetu.
          prerelease: true
          make_latest: false
          files: |
            vajecna-krava/dist/VajecnaKrava-Windows.zip
            vajecna-krava/dist/VajecnaKrava-HTML.zip
